---
- name: Ensure MariaDB Service is Running
  hosts: all
  become: yes
  tasks:
    - name: Check MariaDB service status and register output
      ansible.builtin.service:
        name: mariadb
        state: started
      register: mariadb_status
      check_mode: yes

    - name: Restart MariaDB if it was not running
      ansible.builtin.service:
        name: mariadb
        state: restarted
        when: mariadb_status.changed == True
